version: "3.9"
services:
  pwnable-kr-docker:
    build: .
    restart: "no"
    stdin_open: true            # docker run -i
    tty: true                   # docker run -t
    hostname: ubuntu
    container_name: pwnable-kr-docker
    networks:
      pwnable.kr-docker-net:
        ipv4_address: 172.16.128.2
    ports:
      - "2159"
      - "22"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined      # This will turn off seccomp confinement for 
                                # the container, which is kinda bad for
                                # sandboxing. May need to rethink this in
                                # the future.
    volumes:
      - /home/$USER/Source:/home/ubuntu/Source

networks:
  pwnable.kr-docker-net:
    ipam:
      config:
        - subnet: 172.16.128.0/24
